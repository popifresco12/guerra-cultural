<!-- Cruce con Bluesky: datos de Okupacion en las dos plataformas -->
<style>
  #gcOkup { max-width:1200px; margin:1rem auto 0; padding:0 1rem; }
  #gcOkup .ok { border:1px solid rgba(245,158,11,0.38); background:rgba(245,158,11,0.07);
               border-radius:12px; padding:0.75rem 1.05rem; font-size:0.86rem; line-height:1.55; }
  #gcOkup b { color:#f59e0b; }
  #gcOkup span { opacity:.8; }
  #gcOkup a { color:#f59e0b; }
  @media (max-width: 700px) { #gcOkup { padding: 0 0.7rem; } }
</style>
<section id="gcOkup"></section>
<script>
  (async function () {
    var caja = document.getElementById("gcOkup");
    if (!caja) { return; }
    try {
      var resp = await fetch("comparativa.json", { cache: "no-store" });
      if (!resp.ok) { throw new Error("HTTP " + resp.status); }
      var datos = await resp.json();
      var lista = (datos.temas || []).filter(function (x) { return x.id === "okupacion"; });
      if (lista.length === 0) { caja.innerHTML = ""; return; }
      var t = lista[0];

      var interno = document.createElement("div");
      interno.className = "ok";

      var titulo = document.createElement("b");
      titulo.textContent = "\uD83E\uDD8B Okupación \u2014 X: " + t.x_rel + "/100 · Bluesky: " + t.bs_rel + "/100";
      interno.appendChild(titulo);

      if (t.bs_engagement !== null && t.bs_engagement !== undefined) {
        var detalle = document.createElement("span");
        detalle.textContent = " (" + Number(t.bs_engagement).toLocaleString("es-ES") + " de engagement en Bluesky, " + t.bs_posts + " posts)";
        interno.appendChild(detalle);
      }

      interno.appendChild(document.createTextNode(" · "));

      var enlace = document.createElement("a");
      enlace.href = "comparativa.html";
      enlace.textContent = "Ver comparativa";
      interno.appendChild(enlace);

      caja.innerHTML = "";
      caja.appendChild(interno);
    } catch (e) {
      caja.innerHTML = "";
    }
  })();
</script>
